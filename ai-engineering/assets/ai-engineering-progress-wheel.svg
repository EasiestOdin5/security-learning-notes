<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">AI Engineering progress wheel</title>
<desc id="desc">Radar-style wheel with AI engineering topics around the outside, current demonstrated progress from the center, and goal levels as a dashed outline.</desc>
<style>
.grid{fill:none;stroke:#8c959f;stroke-width:1;opacity:.35} .goal{fill:none;stroke:#8250df;stroke-width:2.5;stroke-dasharray:8 6;opacity:.8}
.current{fill:#0969da;fill-opacity:.22;stroke:#0969da;stroke-width:3} .dot{fill:#0969da}
.label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;font-weight:600;fill:#24292f}
.score{font-size:12px;font-weight:400;fill:#57606a} .legend{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;fill:#24292f}
.ring-label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;fill:#57606a}
@media (prefers-color-scheme:dark){.label,.legend{fill:#f0f6fc} .score,.ring-label{fill:#8c959f} .current{fill:#58a6ff;stroke:#58a6ff} .dot{fill:#58a6ff} .goal{stroke:#a371f7}}
</style>
